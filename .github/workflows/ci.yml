name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      # Spin up a cloud PostgreSQL database for testing
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: placeprep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Spin up a cloud Redis cache
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure Cloud Environment Variables
        working-directory: ./backend
        run: |
          echo 'DATABASE_URL="postgresql://postgres:password@localhost:5432/placeprep_test?schema=public"' > .env.test
          echo 'REDIS_URL="redis://localhost:6379"' >> .env.test
          echo 'JWT_SECRET="github_actions_super_secret"' >> .env.test

      - name: Generate Prisma Client & Push Schema
        working-directory: ./backend
        run: |
          npx prisma generate
          dotenv -e .env.test -- npx prisma db push --accept-data-loss

      - name: Execute Automated Test Suite
        working-directory: ./backend
        run: npm test
